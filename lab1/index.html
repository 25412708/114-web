<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸運大轉盤</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f39c12;
            --bg-color: #f0f2f5;
            --text-color: #333;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* 轉盤容器與指標 */
        .wheel-wrapper {
            position: relative;
            margin: 20px auto;
            width: 300px;
            height: 300px;
        }

        #wheelCanvas {
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 30px solid #e74c3c;
            z-index: 10;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 1rem;
            font-size: 1rem;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #result {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
            min-height: 1.8rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎡 幸運大轉盤</h1>
    
    <div class="wheel-wrapper">
        <div class="pointer"></div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
    </div>

    <div id="result">準備抽籤...</div>

    <textarea id="nameInput" placeholder="輸入名單 (每行一個名字)" oninput="drawWheel()">
小明
小華
小花
大強
阿龍</textarea>
    
    <button id="spinBtn" onclick="spin()">開始轉動！</button>
</div>

<script>
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const nameInput = document.getElementById('nameInput');
    const spinBtn = document.getElementById('spinBtn');
    const resultDisplay = document.getElementById('result');

    let currentRotation = 0;
    let isSpinning = false;
    const colors = ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF', '#FF9F40', '#8BC34A', '#F44336'];

    // 繪製轉盤
    function drawWheel() {
        const names = getNames();
        const numSegments = names.length;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = centerX;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (numSegments === 0) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#ddd';
            ctx.fill();
            return;
        }

        const angleStep = (2 * Math.PI) / numSegments;

        names.forEach((name, i) => {
            const startAngle = i * angleStep;
            const endAngle = startAngle + angleStep;

            // 畫扇形
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.fillStyle = colors[i % colors.length];
            ctx.fill();
            ctx.stroke();

            // 畫文字
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(startAngle + angleStep / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = 'white';
            ctx.font = 'bold 16px sans-serif';
            ctx.fillText(name, radius - 10, 10);
            ctx.restore();
        });
    }

    function getNames() {
        return nameInput.value.split('\n').map(n => n.trim()).filter(n => n !== "");
    }

    function spin() {
        if (isSpinning) return;
        
        const names = getNames();
        if (names.length < 2) {
            resultDisplay.textContent = "請輸入至少兩個名字！";
            return;
        }

        isSpinning = true;
        spinBtn.disabled = true;
        resultDisplay.textContent = "旋轉中...";

        // 隨機旋轉角度：基本圈數 (5圈) + 隨機角度
        const extraDegree = Math.floor(Math.random() * 360);
        const totalRotation = currentRotation + 1800 + extraDegree; 
        
        currentRotation = totalRotation;
        canvas.style.transform = `rotate(${totalRotation}deg)`;

        // 動態結束後計算結果
        setTimeout(() => {
            isSpinning = false;
            spinBtn.disabled = false;

            // 計算指針指向的名字
            // 因為指針在最上方 (270度位置)，轉盤是順時針轉
            const actualDegree = totalRotation % 360;
            const angleStep = 360 / names.length;
            
            // 指針相對於轉盤圓心的角度計算 (修正偏移量)
            // 轉盤旋轉了 totalRotation 度，所以原本 0 度的位置現在在 totalRotation 度
            // 指針固定在頂部 (-90度)，所以要找相對位置
            const winningIndex = Math.floor((360 - (actualDegree % 360) + 270) % 360 / angleStep);
            
            resultDisplay.textContent = `恭喜：${names[winningIndex]}！`;
        }, 4000); // 對應 CSS 的 transition 時間
    }

    // 初始化繪製
    window.onload = drawWheel;
</script>

</body>
</html>
