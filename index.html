<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>洪敏芸的個人網站</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #f4f6f9;
            color: #333;
        }

        header {
            background-color: #4a90e2;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        section {
            padding: 40px 20px;
            max-width: 800px;
            margin: auto;
        }

        h2 {
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 10px;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
            color: white;
        }

        a {
            color: #4a90e2;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<header>
    <h1>洪敏芸</h1>
    <p>歡迎來到我的個人網站</p>
</header>

<section>
    <h2>關於我</h2>
    <div class="card">
        <p>你好，我是洪敏芸。目前正在學習網頁設計與程式開發。</p>
        <p>喜歡設計、創作與學習新技術。</p>
    </div>

    <h2>技能</h2>
    <div class="card">
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript（學習中）</li>
        </ul>
    </div>

    <h2>聯絡方式</h2>
    <div class="card">
        <p>Email：your@email.com</p>
        <p>Instagram：<a href="#">@youraccount</a></p>
    </div>
</section>

<footer>
    © 2026 洪敏芸 All Rights Reserved.
</footer>

</body>
</html>
